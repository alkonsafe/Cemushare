<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moderator — emulatorSHARE</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0b0e14; color: #dbe2ef; padding: 0 0 4rem; }
  header { position: sticky; top: 0; display: flex; align-items: center; gap: 1rem; padding: .8rem 1.2rem; background: #11151f; border-bottom: 1px solid #232a3a; z-index: 5; }
  header h1 { font-size: 1.05rem; margin: 0; }
  header .who { margin-left: auto; color: #8b96ab; font-size: .85rem; }
  header .who b { color: #e6edf7; }
  main { padding: 1rem 1.2rem; max-width: 1200px; margin: 0 auto; display: grid; gap: 1rem; }
  section { background: #11151f; border: 1px solid #232a3a; border-radius: 10px; padding: .9rem 1rem; }
  h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: #8b96ab; margin: 0 0 .6rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #1a2130; }
  th { color: #8b96ab; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: .05rem .5rem; border-radius: 99px; font-size: .75rem; }
  .on  { background: #10391f; color: #58d68d; }
  .off { background: #3a1216; color: #e0707a; }
  .banned { background: #3a1216; color: #e0707a; }
  .owner { background: #372a10; color: #eab04d; }
  .muted { color: #8b96ab; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .4rem 0; }
  input, select, button {
    background: #0b0e14; color: #dbe2ef; border: 1px solid #2c3650;
    border-radius: 8px; padding: .4rem .6rem; font: inherit;
  }
  button { cursor: pointer; border-color: #35415f; }
  button:hover { background: #1a2234; }
  button.danger { border-color: #6e2b33; color: #e0707a; }
  button.ok { border-color: #2b6e44; color: #58d68d; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .6rem; }
  .stat { background: #0b0e14; border: 1px solid #232a3a; border-radius: 8px; padding: .5rem .8rem; }
  .stat b { display: block; font-size: 1.2rem; }
  .stat span { color: #8b96ab; font-size: .75rem; }
  .keylog { max-height: 340px; overflow: auto; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; }
  .err { color: #e0707a; }
  a { color: #7fb1ff; }
</style>
</head>
<body>
<header>
  <h1>🛡 moderator</h1>
  <span class="who" id="who"></span>
  <a href="/">← back to the arcade</a>
</header>
<main>
  <section><h2>status</h2><div class="statgrid" id="status"></div></section>

  <section><h2>consoles + who's on them</h2>
    <table><thead><tr><th>console</th><th>state</th><th>game</th><th>mode</th><th>viewers</th></tr></thead>
    <tbody id="consoles"></tbody></table>
  </section>

  <section><h2>registered users</h2>
    <table><thead><tr><th>id</th><th>username</th><th>discord</th><th>created</th><th>state</th><th></th></tr></thead>
    <tbody id="users"></tbody></table>
  </section>

  <section><h2>keylog <span class="muted">(latest 300 — full history in keylog.log on the relay)</span></h2>
    <div class="keylog">
    <table><thead><tr><th>time</th><th>user</th><th>console</th><th>pressed</th><th>released</th></tr></thead>
    <tbody id="keylog"></tbody></table>
    </div>
  </section>

  <section><h2>bans</h2>
    <div class="row">
      <select id="banKind"><option value="user">user</option><option value="ip">ip</option></select>
      <input id="banValue" placeholder="username or ip" size="24">
      <input id="banReason" placeholder="reason (optional)" size="28">
      <button class="danger" onclick="ban()">ban</button>
    </div>
    <table><thead><tr><th>kind</th><th>value</th><th>reason</th><th>added</th><th></th></tr></thead>
    <tbody id="bans"></tbody></table>
  </section>

  <section><h2>admins</h2>
    <div class="row">
      <input id="adminName" placeholder="username" size="24">
      <button class="ok" onclick="addAdmin()">add admin</button>
    </div>
    <table><thead><tr><th>username</th><th>added</th><th></th></tr></thead>
    <tbody id="admins"></tbody></table>
  </section>
</main>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
const hdrs = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = (ts) => { if (!ts) return '—'; const d = new Date(ts); return d.toLocaleTimeString(); };
const fmtD = (ts) => { if (!ts) return '—'; const d = new Date(ts); return d.toISOString().slice(0, 10); };

async function jget(u) {
    const r = await fetch(u, { headers: hdrs });
    if (r.status === 403) { alert("no"); throw new Error('no'); }
    return r.json();
}
async function jpost(u, body) {
    const r = await fetch(u, { method: 'POST', headers: hdrs, body: JSON.stringify(body || {}) });
    if (r.status === 403) { alert("no"); throw new Error('no'); }
    return r.json();
}

function render(p) {
  const s = p.status;
  document.getElementById('status').innerHTML = [
    ['viewers online', s.viewers], ['consoles', s.online + ' / ' + s.consoles],
    ['registered users', s.users], ['relay uptime', Math.floor(s.uptimeSec / 60) + 'm'],
    ['host token', s.hostToken ? 'set' : 'MISSING'], ['discord auth', s.discord ? 'on' : 'off'],
  ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('') +
  `<div class="stat" style="grid-column: 1/-1"><span>owner: <b>${esc(p.owner || '(none — set RELAY_OWNER)')}</b> · relay log: ${esc(s.logFile)} · keylog: ${esc(s.keylogFile)}</span></div>`;

  document.getElementById('consoles').innerHTML = p.consoles.map((c) => `
    <tr>
      <td><b>${esc(c.name)}</b> <span class="muted mono">${esc(c.key)}</span></td>
      <td><span class="pill ${c.online ? 'on' : 'off'}">${c.online ? 'live' : 'down'}</span></td>
      <td>${esc(c.currentGame || '—')}</td>
      <td class="muted">${esc(c.mode)} · ${c.games} games</td>
      <td>${c.viewers.length ? c.viewers.map((v) => `<span class="pill on">${esc(v.name)}</span> <span class="muted mono">${esc(v.ip)}</span>`).join('<br>') : '<span class="muted">nobody</span>'}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">no consoles have ever registered</td></tr>';

  document.getElementById('users').innerHTML = p.users.map((u) => `
    <tr>
      <td class="muted">${u.id}</td>
      <td>${esc(u.username)}</td>
      <td>${u.discord ? '✓' : ''}</td>
      <td class="muted">${fmtD(u.createdAt)}</td>
      <td>${u.banned ? '<span class="pill banned">banned</span>' : '<span class="pill on">ok</span>'}</td>
      <td><button class="${u.banned ? 'ok' : 'danger'}" onclick="banUser('${esc(u.username)}', ${u.banned})">${u.banned ? 'unban' : 'ban'}</button></td>
    </tr>`).join('');

  document.getElementById('keylog').innerHTML = p.keylog.slice().reverse().map((k) => `
    <tr>
      <td class="muted mono">${fmtT(k.at)}</td>
      <td>${esc(k.user)}</td>
      <td class="mono">${esc(k.console)}</td>
      <td class="mono">${esc((k.pressed || []).join(' '))}</td>
      <td class="muted mono">${esc((k.released || []).join(' '))}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">no keys captured yet</td></tr>';

  document.getElementById('bans').innerHTML = p.bans.map((b) => `
    <tr>
      <td><span class="pill ${b.kind === 'ip' ? 'banned' : 'owner'}">${esc(b.kind)}</span></td>
      <td class="mono">${esc(b.value)}</td>
      <td class="muted">${esc(b.reason || '')}</td>
      <td class="muted">${fmtD(b.added_at)}</td>
      <td><button class="ok" onclick="unban('${esc(b.kind)}', '${esc(b.value)}')">unban</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">no bans</td></tr>';

  document.getElementById('admins').innerHTML = (p.admins || []).map((a) => `
    <tr>
      <td>${esc(a.username)} ${a.username === p.owner ? '<span class="pill owner">owner</span>' : ''}</td>
      <td class="muted">${fmtD(a.added_at)}</td>
      <td><button class="danger" onclick="removeAdmin('${esc(a.username)}')">remove</button></td>
    </tr>`).join('') || '<tr><td colspan="3" class="muted">no extra admins (only the owner)</td></tr>';
}

async function refresh() {
  try { render(await jget('/api/admin/panel')); } catch (e) { if (e.message !== 'no') console.error(e); }
}

async function banUser(name, banned) {
  await jpost('/api/admin/' + (banned ? 'unban' : 'ban'), { kind: 'user', value: name });
  refresh();
}
async function unban(kind, value) { await jpost('/api/admin/unban', { kind, value }); refresh(); }
async function ban() {
  const kind = document.getElementById('banKind').value;
  const value = document.getElementById('banValue').value.trim();
  const reason = document.getElementById('banReason').value.trim();
  if (!value) return;
  await jpost('/api/admin/ban', { kind, value, reason });
  document.getElementById('banValue').value = ''; document.getElementById('banReason').value = '';
  refresh();
}
async function addAdmin() {
  const u = document.getElementById('adminName').value.trim();
  if (!u) return;
  await jpost('/api/admin/addadmin', { username: u });
  document.getElementById('adminName').value = '';
  refresh();
}
async function removeAdmin(u) { await jpost('/api/admin/removeadmin', { username: u }); refresh(); }

(async () => {
  const check = await fetch('/api/admin/check', { headers: hdrs }).then((r) => r.json()).catch(() => null);
  if (!check || !check.loggedIn) { location.href = '/'; return; }
  if (!check.admin) { alert("no"); document.body.innerHTML = '<p style="padding:2rem" class="err">no.</p>'; return; }
  document.getElementById('who').innerHTML = `logged in as <b>${esc(check.username)}</b>${check.owner ? ' <span class="pill owner">owner</span>' : ''}`;
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>

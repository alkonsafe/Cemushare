<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>emulatorSHARE — Mario 64 host</title>
<style>
  html, body {
    margin: 0;
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #canvas {
    display: block;
    image-rendering: pixelated;
    background: #000;
  }

  #boot { position: fixed; left: 8px; top: 8px; color: #6f6; font: 12px monospace; z-index: 9; }
</style>
<!-- host.js FIRST as a classic script, BEFORE the emulator bundle. It installs
     the AudioContext shim + viewport pinning, which only work if present before
     the wasm constructs its context and CSS-casted canvas. -->
<script src="/_shared/host.js"></script>
</head>
<body>
  <canvas id="canvas" tabindex="0" width="320" height="240" data-host-canvas="1"></canvas>
  <div id="boot">booting…</div>

<script>
  window.Module = window.Module || {};
  Module.canvas = document.getElementById('canvas');
  // The wasm loads from ./bin/ relative to this page. Emscripten calls
  // locateFile(path, scriptDirectory); we must keep the /bin/ prefix or the
  // fetch resolves against the page URL and 404s.
  Module.locateFile = (p, prefix) => (p === 'sm64.wasm' ? (prefix || 'bin/') + p : p);
  Module.preRun = Module.preRun || [];
  Module.postRun = Module.postRun || [];
  Module.print = (t) => console.log(t);
  Module.printErr = (t) => console.warn(t);
  Module.setStatus = (t) => {
    const el = document.getElementById('boot');
    if (el) { el.textContent = t || ''; if (!t) el.style.display = 'none'; }
  };

  // Persistent save in the chromium profile (IndexedDB). Survives restarts
  // because the profile dir is a mounted volume.
  Module.preRun.push(function () {
    try {
      if (Module.FS && Module.IDBFS) {
        try { Module.FS.mkdir('/save'); } catch {}
        Module.FS.mount(Module.IDBFS, {}, '/save');
      }
    } catch (err) { console.error('save mount failed:', err); }
  });

  Module.onRuntimeInitialized = function () {
    try {
      if (Module.FS && Module.IDBFS) {
        Module.FS.syncfs(true, (err) => err && console.warn('save load error:', err));
        window.saveNow = function (cb) {
          try { if (typeof Module.writeSave === 'function') Module.writeSave(); } catch {}
          Module.FS.syncfs(false, (e) => typeof cb === 'function' && cb(e));
        };
        setInterval(() => window.saveNow(), 5000);
      }
    } catch (err) { console.error('save init failed:', err); }

    if (typeof window.__hostStart === 'function') window.__hostStart();
  };

  // ── Boot diagnostics for the 1920x270 capture investigation ────────────────
  // Host.js caps the canvas width/height ATTRIBUTES but the presented layer (what
  // captureStream returns) can still be resized by the game via Emscripten's
  // setCanvasSize / updateCanvasDimensions, which also writes canvas.style.width/
  // height with !important (beating our stylesheet). Log what actually changes.
  (function diag() {
    const c = document.getElementById('canvas');

    const glInfo = (M) => {
      try {
        const cv = M && M.canvas;
        const g = cv && cv.GLctxObject && cv.GLctxObject.GLctx;
        if (!g) return 'gl=-  buf=-x-';
        const vp = g.getParameter(0x0BA2);
        const vps = vp ? Array.from(vp).join('x') : '-';
        return 'glview=' + vps + '  buf=' + g.drawingBufferWidth + 'x' + g.drawingBufferHeight;
      } catch (e) { return 'gl=err'; }
    };

    const snap = (tag) => {
      const M = window.Module;
      const r = c.getBoundingClientRect();
      const wn = (window.Browser && Browser.windowedWidth) ? Browser.windowedWidth + 'x' + Browser.windowedHeight : '0';
      const nw = (M && M.canvas) ? (M.canvas.widthNative || '-') + 'x' + (M.canvas.heightNative || '-') : '-';
      console.log('[m64]', tag,
        'attr=', c.width + 'x' + c.height,
        'style=', (c.style.width || '-') + '/' + (c.style.height || '-'),
        'rect=', Math.round(r.width) + 'x' + Math.round(r.height),
        'dpr=', window.devicePixelRatio,
        'win=', window.innerWidth + 'x' + window.innerHeight,
        'cli=', document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight,
        'scr=', screen.width + 'x' + screen.height,
        'nw=', nw, 'wn=', wn, glInfo(M));
    };
    snap('booting');

    // Trace setAttribute('width'/'height') writes specifically: host.js's
    // prototype-cap only guards the PROPERTY path (canvas.width = v), so if the
    // game writes the attrs via setAttribute we see it exactly here.
    const _origSetAttr = c.setAttribute.bind(c);
    c.setAttribute = function (k, v) {
      if ((k === 'width' || k === 'height') && v !== undefined && v !== null) {
        const oldV = k === 'width' ? c.width : c.height;
        console.log('[m64] setAttribute', k, oldV, '->', v, 't=' + Math.round(performance.now()) + 'ms');
      }
      return _origSetAttr(k, v);
    };

    // Catch EVERY attribute change on the canvas regardless of how it was
    // written (property setter vs setAttribute) — host.js's prototype cap only
    // intercepts the property path, so a 1920x270 along a different path would
    // slip through invisibly. Here it is LOG-ONLY; the actual correction uses
    // Module.setCanvasSize (below) so the game's resize listeners fire and it
    // re-renders to fill the new surface instead of clipping into a corner.
    const attrWatch = new MutationObserver((muts) => {
      for (const m of muts) {
        const oldV = m.oldValue || '';
        const newV = c.getAttribute(m.attributeName) || '';
        console.log('[m64] attr-changed', m.attributeName,
          'old=(' + oldV + ')', 'new=(' + newV + ')',
          't=' + Math.round(performance.now()) + 'ms');
        if (m.attributeName === 'width' || m.attributeName === 'height') {
          const r = c.getBoundingClientRect();
          console.log('[m64]   after:', 'attr=', c.width + 'x' + c.height,
            'rect=', Math.round(r.width) + 'x' + Math.round(r.height), glInfo(window.Module));
        }
      }
    });
    try {
      attrWatch.observe(c, { attributes: true, attributeOldValue: true,
        attributeFilter: ['width', 'height', 'style'] });
    } catch (e) { console.error('[m64] attrWatch failed:', e); }
    for (const ms of [200, 500, 900, 1100, 1500, 2000, 3500, 5500]) setTimeout(() => snap('t+' + ms), ms);

    // ── Size watchdog ──────────────────────────────────────────────────────
    // The game boots its canvas at 320x240, then during init grows it to its own
    // reference size (1920x270 at boot, 1920x1080 after a resize). We want 16:9
    // to match the 640x360 viewer box exactly.
    //
    // IMPORTANT: we deliberately do NOT use Module.setCanvasSize here. That path
    // fires the game's resize listeners, and the game's own resize handler then
    // re-asserts ITS computed width — pinning 480x270 made it re-assert ~213
    // forever (the endless reconfigure loop). Writing the canvas ATTRIBUTES via
    // the property path (c.width = v) sends no resize event, so the game never
    // fights back; the GL viewport wrapper below then forces the raster to the
    // real buffer, so the full frame surfaces instead of a corner/second strip.
    // host.js's cap setter may downscale 640x360 -> 480x270 — same 16:9 aspect.
    const GOAL_W = 640, GOAL_H = 360;
    let _lastW = 0, _lastH = 0;
    function correctSize() {
      if (_lastW && c.width === _lastW && c.height === _lastH) return; // stable
      const prev = c.width + 'x' + c.height;
      try {
        c.height = GOAL_H;           // set height first so any host.js cap keeps 16:9
        c.width = GOAL_W;            // last write wins; game gets no resize event
      } catch (err) { console.error('[m64] canvas resize failed:', err); return; }
      _lastW = c.width;
      _lastH = c.height;
      console.log('[m64] canvas ' + prev + ' -> ' + _lastW + 'x' + _lastH);
    }
    setInterval(correctSize, 100);
    setTimeout(correctSize, 400);
    setTimeout(correctSize, 1000);
    setTimeout(correctSize, 2000);

    // ── GL viewport fix ────────────────────────────────────────────────────
    // The game re-anchors its GL viewport to its own reference size (1920x1080)
    // whenever the canvas resizes, which is LARGER than the real canvas, so
    // WebGL clips the render and we see only a corner. Force every gl.viewport
    // call to the canvas's CURRENT buffer (re-read each call, so it tracks
    // watchdog resizes too). Defaults zx=zy=1 => viewport exactly the buffer =
    // full uncropped frame; the game's 16:9 world matches the 16:9 canvas, so no
    // reshaping is needed. m64zx/m64zy (scale) and m64ox/m64oy (pan) remain as
    // URL overrides: viewport bigger than the canvas crops/zooms that axis,
    // smaller letterboxes/unzooms it.
    const _m64p = new URLSearchParams(location.search);
    const _ZX = parseFloat(_m64p.get('m64zx') || '1');   // >1 = zoom-in on X, <1 = unzoom
    const _ZY = parseFloat(_m64p.get('m64zy') || '1');   // >1 = zoom-in on Y, <1 = unzoom
    const _OX = parseFloat(_m64p.get('m64ox') || '0');
    const _OY = parseFloat(_m64p.get('m64oy') || '0');
    console.log('[m64] viewport knobs zx=' + _ZX + ' zy=' + _ZY + ' ox=' + _OX + ' oy=' + _OY);
    const _vpTimer = setInterval(() => {
      const M = window.Module;
      const cv = M && M.canvas;
      const g = cv && cv.GLctxObject && cv.GLctxObject.GLctx;
      if (!g || g.viewport.__m64Fixed) return;
      const orig = g.viewport;
      g.viewport = function (x, y, w, h) {
        const vw = Math.max(1, Math.round(cv.width * _ZX));
        const vh = Math.max(1, Math.round(cv.height * _ZY));
        return orig.call(this, Math.round(_OX), Math.round(_OY), vw, vh);
      };
      g.viewport.__m64Fixed = true;
      console.log('[m64] viewport wrapper installed on ' + cv.width + 'x' + cv.height
        + ' -> view ' + Math.round(cv.width * _ZX) + 'x' + Math.round(cv.height * _ZY));
      try { orig.call(g, Math.round(_OX), Math.round(_OY), Math.round(cv.width * _ZX), Math.round(cv.height * _ZY)); } catch (e) {}
      clearInterval(_vpTimer);
    }, 25);
  })();
</script>
<script src="./bin/sm64.js"></script>
</body>
</html>

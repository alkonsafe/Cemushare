<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>emulatorSHARE — Mario 64 host</title>
<style>
  html, body {
    margin: 0;
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #canvas {
    display: block;
    image-rendering: pixelated;
    background: #000;
  }

  #boot { position: fixed; left: 8px; top: 8px; color: #6f6; font: 12px monospace; z-index: 9; }
</style>
<!-- host.js FIRST as a classic script, BEFORE the emulator bundle. It installs
     the AudioContext shim + viewport pinning, which only work if present before
     the wasm constructs its context and CSS-casted canvas. -->
<script src="/_shared/host.js"></script>
</head>
<body>
  <canvas id="canvas" tabindex="0" width="320" height="240" data-host-canvas="1"></canvas>
  <div id="boot">booting…</div>

<script>
  window.Module = window.Module || {};
  Module.canvas = document.getElementById('canvas');
  // The wasm loads from ./bin/ relative to this page. Emscripten calls
  // locateFile(path, scriptDirectory); we must keep the /bin/ prefix or the
  // fetch resolves against the page URL and 404s.
  Module.locateFile = (p, prefix) => (p === 'sm64.wasm' ? (prefix || 'bin/') + p : p);
  Module.preRun = Module.preRun || [];
  Module.postRun = Module.postRun || [];
  Module.print = (t) => console.log(t);
  Module.printErr = (t) => console.warn(t);
  Module.setStatus = (t) => {
    const el = document.getElementById('boot');
    if (el) { el.textContent = t || ''; if (!t) el.style.display = 'none'; }
  };

  // Persistent save in the chromium profile (IndexedDB). Survives restarts
  // because the profile dir is a mounted volume.
  Module.preRun.push(function () {
    try {
      if (Module.FS && Module.IDBFS) {
        try { Module.FS.mkdir('/save'); } catch {}
        Module.FS.mount(Module.IDBFS, {}, '/save');
      }
    } catch (err) { console.error('save mount failed:', err); }
  });

  Module.onRuntimeInitialized = function () {
    try {
      if (Module.FS && Module.IDBFS) {
        Module.FS.syncfs(true, (err) => err && console.warn('save load error:', err));
        window.saveNow = function (cb) {
          try { if (typeof Module.writeSave === 'function') Module.writeSave(); } catch {}
          Module.FS.syncfs(false, (e) => typeof cb === 'function' && cb(e));
        };
        setInterval(() => window.saveNow(), 5000);
      }
    } catch (err) { console.error('save init failed:', err); }

    if (typeof window.__hostStart === 'function') window.__hostStart();
  };

  // ── Boot diagnostics for the 1920x270 capture investigation ────────────────
  // Host.js caps the canvas width/height ATTRIBUTES but the presented layer (what
  // captureStream returns) can still be resized by the game via Emscripten's
  // setCanvasSize / updateCanvasDimensions, which also writes canvas.style.width/
  // height with !important (beating our stylesheet). Log what actually changes.
  (function diag() {
    const c = document.getElementById('canvas');
    const snap = (tag) => {
      const r = c.getBoundingClientRect();
      console.log('[m64]', tag,
        'attr=', c.width + 'x' + c.height,
        'style=', (c.style.width || '-') + '/' + (c.style.height || '-'),
        'rect=', Math.round(r.width) + 'x' + Math.round(r.height),
        'dpr=', window.devicePixelRatio,
        'win=', window.innerWidth + 'x' + window.innerHeight,
        'cli=', document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight,
        'scr=', screen.width + 'x' + screen.height);
    };
    snap('booting');

    // Catch EVERY attribute change on the canvas regardless of how it was
    // written (property setter vs setAttribute) — host.js's prototype cap only
    // intercepts the property path, so a 1920x270 along a different path would
    // slip through invisibly. Here it is LOG-ONLY; the actual correction uses
    // Module.setCanvasSize (below) so the game's resize listeners fire and it
    // re-renders to fill the new surface instead of clipping into a corner.
    const attrWatch = new MutationObserver((muts) => {
      for (const m of muts) {
        const oldV = m.oldValue || '';
        const newV = c.getAttribute(m.attributeName) || '';
        console.log('[m64] attr-changed', m.attributeName,
          'old=(' + oldV + ')', 'new=(' + newV + ')',
          't=' + Math.round(performance.now()) + 'ms');
        if (m.attributeName === 'width' || m.attributeName === 'height') {
          const r = c.getBoundingClientRect();
          console.log('[m64]   after:', 'attr=', c.width + 'x' + c.height,
            'rect=', Math.round(r.width) + 'x' + Math.round(r.height));
        }
      }
    });
    try {
      attrWatch.observe(c, { attributes: true, attributeOldValue: true,
        attributeFilter: ['width', 'height', 'style'] });
    } catch (e) { console.error('[m64] attrWatch failed:', e); }
    for (const ms of [200, 500, 1000, 2000, 3500]) setTimeout(() => snap('t+' + ms), ms);

    // ── Size watchdog ──────────────────────────────────────────────────────
    // The game boots its canvas at 320x240, then during init grows it to
    // 1920x270 (a mismatch it computes itself). At 1920x270 the picture is a
    // stretched horizontal strip; if we only shrink the canvas ATTRIBUTES the
    // game still renders at its own size and we see a zoomed corner. So re-drive
    // its own resize API (setCanvasSize -> updateCanvasDimensions +
    // updateResizeListeners) to 480x360 (4:3) so the emulator re-renders to
    // fill the surface. host.js's cap setter also allows 480x360 (aspect kept,
    // MAX_DIM=480).
    const PIN_W = 480, PIN_H = 360;
    let correcting = false;
    function correctSize() {
      const M = window.Module;
      if (!M || typeof M.setCanvasSize !== 'function') return;
      if (correcting) return;
      if (c.width === PIN_W && c.height === PIN_H) return;
      correcting = true;
      try {
        console.log('[m64] setCanvasSize(' + PIN_W + ',' + PIN_H + ') ' +
          'from attr ' + c.width + 'x' + c.height);
        M.setCanvasSize(PIN_W, PIN_H);
      } catch (err) { console.error('[m64] setCanvasSize failed:', err); }
      finally { correcting = false; }
    }
    setInterval(correctSize, 100);
    setTimeout(correctSize, 400);
    setTimeout(correctSize, 1000);
    setTimeout(correctSize, 2000);
    const wrapOnce = setInterval(() => {
      const M = window.Module;
      if (M && typeof M.setCanvasSize === 'function' && !M.setCanvasSize.__wrapped) {
        const orig = M.setCanvasSize;
        M.setCanvasSize = function (w, h, nu) {
          console.log('[m64] setCanvasSize', w + 'x' + h);
          return orig.call(this, w, h, nu);
        };
        M.setCanvasSize.__wrapped = true;
        clearInterval(wrapOnce);
      }
    }, 50);
  })();
</script>
<script src="./bin/sm64.js"></script>
</body>
</html>
